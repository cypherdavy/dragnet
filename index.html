<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows Security</title>
<style>
    body {
        margin: 0;
        background: #f3f3f3;
        font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .win11-window {
        width: 860px;
        height: 560px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 30px rgba(0,0,0,0.15);
        display: flex;
        overflow: hidden;
        border: 1px solid #dadada;
    }

    .nav {
        width: 230px;
        background: #f7f7f7;
        border-right: 1px solid #e2e2e2;
        padding: 25px;
    }

    .nav .title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 25px;
    }

    .nav .section {
        margin-bottom: 20px;
        font-size: 15px;
        color: #444;
    }

    .nav .active {
        background: #e6f0ff;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
    }

    .content {
        flex: 1;
        padding: 28px 38px;
        display: flex;
        flex-direction: column;
    }

    .header {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .sub {
        color: #555;
        margin-bottom: 22px;
        font-size: 14px;
    }

    .scan-visual {
        display: flex;
        align-items: center;
        gap: 30px;
        margin-bottom: 25px;
    }

    .scan-ring {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 6px solid #d0d8f4;
        border-top-color: #3b78ff;
        animation: spin 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .status-text {
        font-size: 17px;
        font-weight: 600;
    }

    .progress-container {
        width: 100%;
        height: 10px;
        background: #e0e0e0;
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 18px;
    }

    .progress {
        height: 100%;
        width: 0%;
        background: #3c7bff;
        transition: width 1s linear;
    }

    #list {
        flex: 1;
        background: #fafafa;
        border: 1px solid #e3e3e3;
        border-radius: 8px;
        padding: 12px;
        overflow-y: auto;
        font-size: 14px;
        line-height: 24px;
    }

    .item {
        padding-bottom: 6px;
        border-bottom: 1px solid #ececec;
    }
</style>
</head>
<body>
<div class="win11-window" role="region" aria-label="Windows Security Window">
    <div class="nav" role="navigation" aria-label="Security navigation">
        <div class="title">Windows Security</div>
        <div class="section active" aria-current="true">Virus &amp; threat protection</div>
        <div class="section">Account protection</div>
        <div class="section">Firewall &amp; network protection</div>
        <div class="section">Device security</div>
        <div class="section">Device performance &amp; health</div>
    </div>

    <div class="content">
        <div class="header">Full scan in progress</div>
        <div class="sub">Your system is being scanned. This may take some time.</div>

        <div class="scan-visual">
            <div class="scan-ring" aria-hidden="true"></div>
            <div class="status-text" id="status" aria-live="polite">Preparing scan...</div>
        </div>

        <div class="progress-container" aria-hidden="false" aria-label="Scan progress">
            <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>

        <div id="list" tabindex="0" aria-live="polite" aria-label="Scanned services list"></div>
    </div>
</div>

<script>
const services = [
    "Windows Update Service",
    "Security Center",
    "Windows Defender Antivirus Service",
    "Windows Event Log",
    "Windows Management Instrumentation",
    "Background Intelligent Transfer Service",
    "Remote Procedure Call (RPC)",
    "Windows Installer",
    "Task Scheduler",
    "Storage Service",
    "DHCP Client",
    "DNS Client",
    "Shell Hardware Detection",
    "Print Spooler",
    "Network Location Awareness",
    "Windows Firewall",
    "Device Install Service",
    "User Profile Service",
    "Group Policy Client",
    "Windows Error Reporting Service",
    "Software Protection Service"
];

let index = 0;
const list = document.getElementById("list");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

function setProgressWidth(percent) {
    progress.style.width = percent + "%";
    progress.setAttribute("aria-valuenow", String(Math.round(percent)));
}

function scanNext() {
    const s = services[index];
    status.textContent = "Scanning: " + s;

    const div = document.createElement("div");
    div.className = "item";
    div.textContent = "✔ " + s;
    list.appendChild(div);

    list.scrollTop = list.scrollHeight;

    const percent = ((index + 1) / services.length) * 100;
    setProgressWidth(percent);

    index++;
    if (index >= services.length) {
        index = 0; 
    }
}

const INTERVAL_MS = 60000;
scanNext();
setInterval(scanNext, INTERVAL_MS);
</script>
</body>
</html>
